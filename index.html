<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio PIT - Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#020617',
                            panel: '#0F172A',
                            text: '#F8FAFC',
                            muted: '#94A3B8',
                            accent: '#3B82F6',
                            success: '#10B981',
                            danger: '#EF4444',
                            warning: '#EAB308'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #F8FAFC; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .falling-item {
            position: absolute;
            top: -10%;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
        }

        /* Animação para o alerta customizado */
        @keyframes fadeInAlert {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInAlert 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-brand-dark min-h-screen text-brand-text flex flex-col md:flex-row md:h-screen md:overflow-hidden relative">
    
    <div id="bg-animation" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>
    <div id="app" class="w-full flex flex-col md:flex-row h-full relative z-10"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('bg-animation');
            const items = ['🚓', '🔗', '🔫', '🚨', '🚔', '🛡️', '👮‍♂️'];
            const numItems = 20;
            for (let i = 0; i < numItems; i++) {
                let el = document.createElement('div');
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.className = 'falling-item';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 15 + 10) + 's'; 
                el.style.animationDelay = (Math.random() * 10) + 's';
                el.style.fontSize = (Math.random() * 15 + 20) + 'px';
                el.style.opacity = '0.05';
                container.appendChild(el);
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBs6l1WQx4ePd2IkY0RdfxR75XCJm13m08",
          authDomain: "gremiopit-3250c.firebaseapp.com",
          projectId: "gremiopit-3250c",
          storageBucket: "gremiopit-3250c.firebasestorage.app",
          messagingSenderId: "22286724105",
          appId: "1:22286724105:web:836befe594b969ccf09cd8",
          measurementId: "G-2CME0BPYLQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const APP_ID = 'gremiopit-v1';
        
        const MONTHS = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        const currentMonthName = MONTHS[new Date().getMonth()];
        
        let state = {
            activeTab: 'dashboard',
            selectedMonth: currentMonthName,
            user: null,
            isAdmin: false,
            members: [],
            transactions: [],
            logs: [], 
            showLoginModal: false,
            loginEmail: '',
            loginPassword: '',
            loginError: '',
            isResetting: false,
            dbError: null,
            
            membersViewMode: window.innerWidth < 768 ? 'monthly' : 'panorama', 
            showReceiptModal: false,
            membersViewMode: window.innerWidth < 768 ? 'monthly' : 'panorama', // Panorama vs Mensal
            showReceiptModal: false,
            receiptTx: null,
            isEditingReceiptSettings: false,
            adminReceiptInfo: JSON.parse(localStorage.getItem('gremio_admin_receipt_info') || '{"name":"","matricula":"","signatureDataUrl":""}'),
            generatedReceiptFile: null,

            expenseImageBase64: null,
            showDetailsModal: false,
            detailsTx: null,
            showPassword: false
        };

        window.state = state;

        /* Override nativo para alert() visando respeitar regra de UI sem alterar a lógica preexistente */
        window.alert = (message) => {
            const modal = document.createElement('div');
            modal.className = 'fixed top-4 right-4 bg-brand-panel border-l-4 border-brand-accent text-white p-4 rounded shadow-2xl z-[9999] flex items-center gap-3 animate-fade-in';
            modal.innerHTML = `<i data-lucide="info" class="text-brand-accent"></i> <div>${message}</div>`;
            document.body.appendChild(modal);
            if(window.lucide) lucide.createIcons({root: modal});
            setTimeout(() => modal.remove(), 4000);
        };

        let unsubMembers = null;
        let unsubTrans = null;
        let unsubLogs = null;
        let isTransitioningAuth = false;

        const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

        const logAction = async (actionText) => {
            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'logs'), {
                    action: actionText,
                    date: new Date().toLocaleString('pt-BR'),
                    createdAt: Date.now()
                });
            } catch (error) { console.error("Erro ao salvar log", error); }
        };

        function setupListeners() {
            if (unsubMembers) unsubMembers();
            if (unsubTrans) unsubTrans();
            if (unsubLogs) unsubLogs(); 

            const membersRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'members');
            const transRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions');
            const logsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'logs');

            unsubMembers = onSnapshot(membersRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                state.dbError = null;
                render();
            }, (error) => {
                if(isTransitioningAuth) return;
                if(error.code === 'permission-denied') state.dbError = 'permission';
                render();
            });

            unsubTrans = onSnapshot(transRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                state.dbError = null;
                render();
            }, (error) => {
                if(isTransitioningAuth) return;
                if(error.code === 'permission-denied') state.dbError = 'permission';
                render();
            });

            unsubLogs = onSnapshot(logsRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); 
                render();
            });
        }

        onAuthStateChanged(auth, (user) => {
            isTransitioningAuth = false;
            if (user) {
                state.user = user;
                state.isAdmin = !user.isAnonymous; 
                setupListeners();
            } else {
                state.user = null;
                state.isAdmin = false;
                signInAnonymously(auth).catch((err) => {
                    console.warn("Autenticação anônima desabilitada.");
                    state.dbError = 'auth-anon-disabled';
                    render();
                });
            }
            render();
        });

        window.handleLogin = async (e) => {
            e.preventDefault();
            state.loginError = '';
            render();
            try {
                await signInWithEmailAndPassword(auth, state.loginEmail, state.loginPassword);
                state.showLoginModal = false;
                state.loginEmail = '';
                state.loginPassword = '';
            } catch (error) {
                state.loginError = 'E-mail ou senha incorretos.';
                render();
            }
        };

        window.handleResetPassword = async (e) => {
            e.preventDefault();
            if(!state.loginEmail) {
                state.loginError = 'Digite seu e-mail para recuperar.';
                render();
                return;
            }
            try {
                await sendPasswordResetEmail(auth, state.loginEmail);
                state.loginError = 'E-mail enviado! Verifique sua caixa de entrada.';
                render();
            } catch(error) {
                state.loginError = 'Erro ao enviar. O e-mail está correto?';
                render();
            }
        };

        window.handleLogout = async () => {
            isTransitioningAuth = true;
            if(unsubMembers) unsubMembers();
            if(unsubTrans) unsubTrans();
            if(unsubLogs) unsubLogs();
            await signOut(auth);
        };

        window.handleAddMember = async (e) => {
            e.preventDefault();
            const name = document.getElementById('newMemberName').value;
            const mat = document.getElementById('newMemberMatricula').value;
            if (!name || !mat || !state.user) return;
            
            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'members'), {
                    name: name,
                    matricula: mat,
                    payments: {},
                    createdAt: Date.now()
                });
                logAction(`Novo Policial adicionado: ${name}`);
            } catch (error) { console.error(error); }
        };

        window.togglePayment = async (memberId, month) => {
            if (!state.user || !state.isAdmin) return;
            const member = state.members.find(m => m.id === memberId);
            if (!member) return;
            
            const isCurrentlyPaid = (member.payments || {})[month];
            const newStatus = !isCurrentlyPaid;

            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', memberId), {
                    [`payments.${month}`]: newStatus
                });

                if (newStatus) {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions'), {
                        type: 'income',
                        description: member.name, 
                        amount: 10,
                        month: month,
                        date: new Date().toLocaleDateString('pt-BR'),
                        isAuto: true,
                        memberId: member.id,
                        createdAt: Date.now()
                    });
                    logAction(`Pagamento confirmado para ${member.name} (Ref: ${month})`);
                } else {
                    const txToDelete = state.transactions.find(t => t.isAuto && t.memberId === member.id && t.month === month);
                    if (txToDelete) {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'transactions', txToDelete.id));
                    }
                    logAction(`Pagamento estornado de ${member.name} (Ref: ${month})`);
                }

            } catch (error) { console.error(error); }
        };

        window.handleDeleteMember = async (id) => {
            if (!state.user || !state.isAdmin) return;
            const member = state.members.find(m => m.id === id);
            try { 
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', id)); 
                if(member) logAction(`Policial removido: ${member.name}`);
            } catch(e) {}
        };

        window.toggleExpenseFields = () => {
            const type = document.querySelector('input[name="transType"]:checked').value;
            const extraFields = document.getElementById('expenseExtraFields');
            if (extraFields) {
                if (type === 'expense') extraFields.classList.remove('hidden');
                else extraFields.classList.add('hidden');
            }
        };

        window.handleExpenseImage = (e) => {
            const file = e.target.files[0];
            if (!file) { state.expenseImageBase64 = null; return; }
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 800; 
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    state.expenseImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.openDetailsModal = (id) => {
            const tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            state.detailsTx = tx;
            state.showDetailsModal = true;
            render();
        };

        window.closeDetailsModal = () => {
            state.showDetailsModal = false;
            state.detailsTx = null;
            render();
        };

        window.togglePassword = () => {
            state.showPassword = !state.showPassword;
            render();
        };

        window.handleAddTransaction = async (e) => {
            e.preventDefault();
            const type = document.querySelector('input[name="transType"]:checked').value;
            const desc = document.getElementById('newTransDesc').value;
            const amount = document.getElementById('newTransAmount').value;
            const dateInput = document.getElementById('newTransDate').value;
            
            if (!desc || !amount || !state.user) return;
            
            let formattedDate = new Date().toLocaleDateString('pt-BR');
            let timestamp = Date.now();
            // Se o usuário selecionou uma data e hora retroativa, usamos ela
            if (dateInput) {
                const d = new Date(dateInput);
                formattedDate = d.toLocaleDateString('pt-BR');
                timestamp = d.getTime();
            }

            let extraData = {};
            if (type === 'expense') {
                extraData = {
                    purchaseLocation: document.getElementById('newTransLocation')?.value || '',
                    purchaseLink: document.getElementById('newTransLink')?.value || '',
                    buyerName: document.getElementById('newTransBuyerName')?.value || '',
                    buyerMatricula: document.getElementById('newTransBuyerMat')?.value || '',
                    receiptImage: state.expenseImageBase64 || null
                };
            }

            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions'), {
                    type,
                    description: desc,
                    amount: parseFloat(amount),
                    month: state.selectedMonth,
                    date: formattedDate,
                    createdAt: timestamp,
                    ...extraData
                });
                logAction(`Registro (${type === 'income' ? 'Receita' : 'Despesa'}): ${desc} - R$ ${amount}`);
                
                // Limpa os campos do formulário após gravar
                document.getElementById('newTransDesc').value = '';
                document.getElementById('newTransAmount').value = '';
                document.getElementById('newTransDate').value = '';

                if (type === 'expense') {
                    if(document.getElementById('newTransLocation')) document.getElementById('newTransLocation').value = '';
                    if(document.getElementById('newTransLink')) document.getElementById('newTransLink').value = '';
                    if(document.getElementById('newTransBuyerName')) document.getElementById('newTransBuyerName').value = '';
                    if(document.getElementById('newTransBuyerMat')) document.getElementById('newTransBuyerMat').value = '';
                    if(document.getElementById('newTransPhoto')) document.getElementById('newTransPhoto').value = '';
                    state.expenseImageBase64 = null;
                }
            } catch(e) { console.error(e); }
        };

        window.handleDeleteTransaction = async (id) => {
            if (!state.user || !state.isAdmin) return;
            const tx = state.transactions.find(t => t.id === id);
            try { 
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'transactions', id)); 
                if(tx) logAction(`Estorno realizado: ${tx.description}`);
            } catch(e) {}
        };

        window.exportReport = function() {
            const m = state.selectedMonth;
            const t = state.transactions.filter(x => x.month === m);
            const income = t.filter(x => x.type === 'income').reduce((a,b) => a + b.amount, 0);
            const expense = t.filter(x => x.type === 'expense').reduce((a,b) => a + b.amount, 0);
            const balance = income - expense;

            const text = `*RELATÓRIO DE CAIXA - GRÊMIO PIT* 🚔\n\n` +
                         `*Mês Ref:* ${m}\n` +
                         `*Efetivo Registrado:* ${state.members.length} policiais\n\n` +
                         `📊 *BALANÇO:*\n` +
                         `🟢 *Arrecadação:* ${formatCurrency(income)}\n` +
                         `🔴 *Despesas:* ${formatCurrency(expense)}\n` +
                         `${balance >= 0 ? '🔵' : '🔴'} *SALDO DO MÊS:* ${formatCurrency(balance)}\n\n` +
                         `_Resumo gerado automaticamente pelo Sistema._`;
            
            const encoded = encodeURIComponent(text);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
            logAction(`Relatório do mês de ${m} exportado para o WhatsApp.`);
        };

        window.openReceiptModal = (id) => {
            const tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            state.receiptTx = tx;
            state.generatedReceiptFile = null;
            
            if (!state.adminReceiptInfo.name || !state.adminReceiptInfo.signatureDataUrl) {
                state.isEditingReceiptSettings = true;
            } else {
                state.isEditingReceiptSettings = false;
            }
            
            state.showReceiptModal = true;
            render();
        };

        window.closeReceiptModal = () => {
            state.showReceiptModal = false;
            state.receiptTx = null;
            state.generatedReceiptFile = null;
            render();
        };

        window.toggleEditReceiptSettings = () => {
            state.isEditingReceiptSettings = !state.isEditingReceiptSettings;
            state.generatedReceiptFile = null;
            render();
        };

        window.saveReceiptSettings = () => {
            const name = document.getElementById('admin-name-input').value;
            const mat = document.getElementById('admin-mat-input').value;
            const canvas = document.getElementById('signaturePad');
            
            if(!name || !mat) {
                alert("Preencha seu Nome e Matrícula.");
                return;
            }

            state.adminReceiptInfo.name = name;
            state.adminReceiptInfo.matricula = mat;
            state.adminReceiptInfo.signatureDataUrl = canvas.toDataURL('image/png');
            
            localStorage.setItem('gremio_admin_receipt_info', JSON.stringify(state.adminReceiptInfo));
            state.isEditingReceiptSettings = false;
            render();
        };

        window.clearSignature = () => {
            const canvas = document.getElementById('signaturePad');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        };

        window.initSignatureCanvas = () => {
            const canvas = document.getElementById('signaturePad');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#020617'; 
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            let drawing = false;

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(state.adminReceiptInfo.signatureDataUrl) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = state.adminReceiptInfo.signatureDataUrl;
            }

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const start = (e) => { 
                e.preventDefault(); 
                if(document.activeElement) document.activeElement.blur(); 
                drawing = true; 
                const pos = getPos(e); 
                ctx.beginPath(); 
                ctx.moveTo(pos.x, pos.y); 
            };
            const draw = (e) => { e.preventDefault(); if(!drawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
            const stop = (e) => { e.preventDefault(); drawing = false; };

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop);
            canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stop);
        };

        window.shareReceiptImage = async () => {
            if (state.generatedReceiptFile) {
                if (navigator.canShare && navigator.canShare({ files: [state.generatedReceiptFile] })) {
                    try {
                        await navigator.share({
                            files: [state.generatedReceiptFile],
                            title: 'Recibo PIT',
                            text: 'Segue em anexo o recibo da movimentação.'
                        });
                    } catch(e) { console.error("Cancelado ou erro no share", e); }
                } else {
                    const url = URL.createObjectURL(state.generatedReceiptFile);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'recibo-pit.png';
                    a.click();
                    alert('Recibo salvo no dispositivo! Agora é só anexar no WhatsApp.');
                }
                return;
            }

            const btn = document.getElementById('btn-share-receipt');
            const origHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processando Imagem...';
            btn.disabled = true;
            
            const element = document.getElementById('receipt-capture-area');
            
            const modalBox = document.getElementById('receipt-modal-box');
            const scrollBox = document.getElementById('receipt-scroll-box');
            const overlay = modalBox ? modalBox.parentElement : null;
            
            if (overlay) {
                overlay.style.position = 'absolute';
                overlay.style.alignItems = 'flex-start';
                overlay.style.height = 'auto';
            }
            if(modalBox) modalBox.style.maxHeight = 'none';
            if(scrollBox) {
                scrollBox.style.overflow = 'visible';
                scrollBox.scrollTop = 0; 
            }
            
            await new Promise(r => setTimeout(r, 200));
            
            try {
                const canvas = await html2canvas(element, { 
                    scale: 2, 
                    backgroundColor: '#ffffff', 
                    useCORS: true,
                    scrollY: -window.scrollY 
                });
                
                if (overlay) {
                    overlay.style.position = '';
                    overlay.style.alignItems = '';
                    overlay.style.height = '';
                }
                if(modalBox) modalBox.style.maxHeight = '';
                if(scrollBox) scrollBox.style.overflow = '';

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'recibo-pit.png', { type: 'image/png' });
                    state.generatedReceiptFile = file; 
                    
                    const captureArea = document.getElementById('receipt-capture-area');
                    if (captureArea) captureArea.style.display = 'none';
                    
                    const editBtn = document.getElementById('edit-receipt-btn-container');
                    if (editBtn) editBtn.style.display = 'none';

                    let previewContainer = document.getElementById('receipt-preview-container');
                    if (!previewContainer) {
                        previewContainer = document.createElement('div');
                        previewContainer.id = 'receipt-preview-container';
                        previewContainer.className = 'w-full flex justify-center my-2';
                        
                        const previewImg = document.createElement('img');
                        previewImg.id = 'receipt-preview-img';
                        previewImg.className = 'w-full max-w-sm rounded-lg shadow-[0_0_15px_rgba(0,0,0,0.5)] border border-brand-muted/20';
                        
                        previewContainer.appendChild(previewImg);
                        btn.parentNode.insertBefore(previewContainer, btn);
                    }

                                            <th class="py-3 px-4 font-medium text-right">Valor</th>
                                            ${state.isAdmin ? '<th class="py-3 px-4 font-medium text-center">Ações</th>' : ''}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${filteredTransactions.filter(t => t.type === 'income').length === 0 ? `
                                            <tr>
                                                <td colspan="${state.isAdmin ? 4 : 3}" class="py-10 text-center text-brand-muted">
                                                    Nenhuma receita neste mês.
                                                </td>
                                            </tr>
                                        ` : filteredTransactions.filter(t => t.type === 'income').slice().reverse().map(tx => `
                                            <tr class="border-b border-brand-muted/5 hover:bg-brand-dark/30 transition-colors group">
                                                <td class="py-4 px-4 text-sm text-brand-muted whitespace-nowrap">${tx.date || new Date(tx.createdAt).toLocaleDateString('pt-BR')}</td>
                                                <td class="py-4 px-4">
                                                    <p class="font-bold text-white">${tx.description}</p>
                                                </td>
                                                <td class="py-4 px-4 text-right font-bold text-brand-success whitespace-nowrap">
                                                    +${formatCurrency(tx.amount)}
                                                </td>
                                                ${state.isAdmin ? `
                                                <td class="py-4 px-4">
                                                    <div class="flex items-center justify-center gap-2">
                                                        <button onclick="openReceiptModal('${tx.id}')" title="Gerar Recibo" class="text-[#10B981] hover:bg-[#10B981]/20 p-2 rounded-lg transition-colors border border-transparent hover:border-[#10B981]/30">
                                                            <i data-lucide="receipt" class="w-5 h-5"></i>
                                                        </button>
                                                        <button onclick="handleDeleteTransaction('${tx.id}')" title="Estornar" class="text-brand-danger hover:bg-brand-danger/20 p-2 rounded-lg transition-colors border border-transparent hover:border-brand-danger/30">
                                                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                                                        </button>
                                                    </div>
                                                </td>` : ''}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Tabela de Despesas -->
                        <div class="bg-brand-panel rounded-2xl shadow-xl border border-brand-danger/20 overflow-hidden flex flex-col">
                            <div class="p-5 bg-brand-danger/10 border-b border-brand-danger/20">
                                <h3 class="text-lg font-bold flex items-center gap-2 text-brand-danger"><i data-lucide="trending-down" class="w-5 h-5"></i> Saídas (Despesas)</h3>
                            </div>
                            <div class="p-0 overflow-x-auto flex-1">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="text-brand-muted border-b border-brand-muted/10 text-sm bg-brand-dark/50">
                                            <th class="py-3 px-4 font-medium">Data</th>
                                            <th class="py-3 px-4 font-medium">Descrição</th>
                                            <th class="py-3 px-4 font-medium text-right">Valor</th>
                                            ${state.isAdmin ? '<th class="py-3 px-4 font-medium text-center">Ações</th>' : ''}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${filteredTransactions.filter(t => t.type === 'expense').length === 0 ? `
                                            <tr>
                                                <td colspan="${state.isAdmin ? 4 : 3}" class="py-10 text-center text-brand-muted">
                                                    Nenhuma despesa neste mês.
                                                </td>
                                            </tr>
                                        ` : filteredTransactions.filter(t => t.type === 'expense').slice().reverse().map(tx => `
                                            <tr class="border-b border-brand-muted/5 hover:bg-brand-dark/30 transition-colors group">
                                                <td class="py-4 px-4 text-sm text-brand-muted whitespace-nowrap">${tx.date || new Date(tx.createdAt).toLocaleDateString('pt-BR')}</td>
                                                <td class="py-4 px-4">
                                                    <div class="flex flex-col items-start gap-1">
                                                        <p class="font-bold text-white">${tx.description}</p>
                                                        ${(tx.purchaseLocation || tx.purchaseLink || tx.buyerName || tx.receiptImage) ? `
                                                            <button onclick="openDetailsModal('${tx.id}')" title="Ver Detalhes da Compra" class="bg-brand-warning/10 text-brand-warning hover:bg-brand-warning/20 px-2 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider flex items-center gap-1 transition-colors border border-brand-warning/20 hover:border-brand-warning/40 mt-1">
                                                                <i data-lucide="search" class="w-3 h-3"></i> Transparência
                                                            </button>
                                                        ` : ''}
                                                    </div>
                                                </td>
                                                <td class="py-4 px-4 text-right font-bold text-brand-danger whitespace-nowrap">
                                                    -${formatCurrency(tx.amount)}
                                                </td>
                                                ${state.isAdmin ? `
                                                <td class="py-4 px-4">
                                                    <div class="flex items-center justify-center gap-2">
                                                        <button onclick="openReceiptModal('${tx.id}')" title="Gerar Recibo" class="text-[#10B981] hover:bg-[#10B981]/20 p-2 rounded-lg transition-colors border border-transparent hover:border-[#10B981]/30">
                                                            <i data-lucide="receipt" class="w-5 h-5"></i>
                                                        </button>
                                                        <button onclick="handleDeleteTransaction('${tx.id}')" title="Estornar" class="text-brand-danger hover:bg-brand-danger/20 p-2 rounded-lg transition-colors border border-transparent hover:border-brand-danger/30">
                                                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                                                        </button>
                                                    </div>
                                                </td>` : ''}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            else if (state.activeTab === 'audit') {
                content += `
                    <div class="bg-brand-panel rounded-2xl p-6 shadow-xl border border-brand-muted/10 h-full">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-bold flex items-center gap-2 text-white"><i data-lucide="history" class="text-brand-accent"></i> Registro de Atividades</h3>
                            <span class="text-xs bg-brand-dark text-brand-muted px-3 py-1 rounded-full border border-brand-muted/20">Auditoria em Tempo Real</span>
                        </div>
                        
                        ${state.logs.length === 0 ? `
                            <div class="text-center py-12 text-brand-muted bg-brand-dark/30 rounded-xl border border-dashed border-brand-muted/20">
                                <i data-lucide="shield-check" class="w-12 h-12 mx-auto mb-3 opacity-50 text-[#EAB308]"></i>
                                <p>Nenhuma atividade registrada no sistema recentemente.</p>
                            </div>
                        ` : `
                            <div class="space-y-4">
                                ${state.logs.slice(0, 50).map(log => `
                                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-brand-dark/50 rounded-xl border border-brand-muted/10 hover:border-brand-muted/30 transition-all">
                                        <div class="flex items-center gap-4 mb-2 sm:mb-0">
                                            <div class="bg-brand-panel p-2 rounded-lg border border-brand-muted/20">
                                                <i data-lucide="terminal" class="text-[#EAB308] w-5 h-5"></i>
                                            </div>
                                            <p class="text-white text-sm md:text-base">${log.action}</p>
                                        </div>
                                        <div class="flex items-center gap-2 text-brand-muted text-xs bg-brand-panel px-3 py-1.5 rounded-lg border border-brand-muted/10 shrink-0">
                                            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                            ${log.date}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                `;
            }

            content += `</main>`;

            // Modal de Login
            if (state.showLoginModal) {
                content += `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-brand-panel rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl border border-brand-muted/20">
                        <div class="flex items-center justify-center w-16 h-16 bg-brand-dark text-brand-accent rounded-full mx-auto mb-4 border border-brand-accent/30 shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                            <i data-lucide="${state.isResetting ? 'mail' : 'lock'}" class="w-8 h-8"></i>
                        </div>
                        
                        <h3 class="text-2xl font-bold text-center mb-2">${state.isResetting ? 'Recuperar Senha' : 'Acesso Admin'}</h3>
                        <p class="text-center text-brand-muted mb-6 text-sm">
                            ${state.isResetting ? 'Enviaremos um link para redefinir sua senha.' : 'Faça login com Email e Senha para habilitar a edição.'}
                        </p>
                        
                        <form onsubmit="${state.isResetting ? 'handleResetPassword(event)' : 'handleLogin(event)'}" class="space-y-4">
                            <input type="email" placeholder="E-mail do Administrador" value="${state.loginEmail}" onchange="state.loginEmail=this.value" class="w-full bg-brand-dark border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white placeholder-brand-muted" required autofocus/>
                            
                            ${!state.isResetting ? `
                            <div class="relative">
                                <input type="${state.showPassword ? 'text' : 'password'}" placeholder="Senha" value="${state.loginPassword}" onchange="state.loginPassword=this.value" class="w-full bg-brand-dark border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white placeholder-brand-muted" required/>
                                <button type="button" onclick="togglePassword()" class="absolute right-3 top-3.5 text-brand-muted hover:text-white transition-colors" title="Mostrar/Ocultar Senha">
                                    <i data-lucide="${state.showPassword ? 'eye-off' : 'eye'}" class="w-5 h-5"></i>
                                </button>
                            </div>
                            ` : ''}
                            
                            ${state.loginError ? `<p class="text-brand-warning text-sm mt-2 text-center bg-brand-warning/10 p-2 rounded-lg">${state.loginError}</p>` : ''}
                            
                            <div class="flex gap-3 mt-8 pt-4">
                                <button type="button" onclick="toggleModal(false)" class="flex-1 px-4 py-3 rounded-xl font-bold text-brand-muted bg-brand-dark hover:bg-brand-muted/10 transition-colors">Cancelar</button>
                                <button type="submit" class="flex-1 px-4 py-3 rounded-xl font-bold text-white bg-brand-accent hover:bg-blue-600 transition-colors shadow-lg shadow-blue-500/30">
                                    ${state.isResetting ? 'Enviar Link' : 'Entrar'}
                                </button>
                            </div>

                            <div class="text-center mt-4">
                                <button type="button" onclick="toggleReset(${!state.isResetting})" class="text-sm text-brand-accent hover:text-blue-400 underline transition-colors">
                                    ${state.isResetting ? 'Voltar para Login' : 'Esqueceu a senha?'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>`;
            }

            if (state.showDetailsModal && state.detailsTx) {
                const tx = state.detailsTx;
                let txTime = "00:00";
                if (tx.createdAt) {
                    const dateObj = new Date(tx.createdAt);
                    if(!isNaN(dateObj)) txTime = dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                }

                content += `
                <div class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-brand-panel rounded-2xl w-full max-w-lg shadow-2xl border border-brand-muted/20 relative my-8 flex flex-col max-h-[90vh]">
                        <div class="p-4 border-b border-brand-muted/20 flex justify-between items-center bg-brand-dark rounded-t-2xl shrink-0">
                            <h3 class="font-bold text-lg flex items-center gap-2 text-brand-warning"><i data-lucide="search" class="w-5 h-5"></i> Detalhes da Despesa</h3>
                            <button onclick="closeDetailsModal()" class="text-brand-muted hover:text-white p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto flex-grow space-y-4">
                            <div class="bg-brand-dark p-4 rounded-xl border border-brand-muted/10">
                                <p class="text-sm text-brand-muted mb-1">Descrição</p>
                                <p class="font-bold text-white text-lg">${tx.description}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-brand-dark p-4 rounded-xl border border-brand-muted/10">
                                    <p class="text-sm text-brand-muted mb-1">Valor</p>
                                    <p class="font-bold text-brand-danger">${formatCurrency(tx.amount)}</p>
                                </div>
                                <div class="bg-brand-dark p-4 rounded-xl border border-brand-muted/10">
                                    <p class="text-sm text-brand-muted mb-1">Data / Hora</p>
                                    <p class="font-bold text-white">${tx.date || new Date(tx.createdAt).toLocaleDateString('pt-BR')} às ${txTime}</p>
                                </div>
                            </div>
                            
                            ${tx.purchaseLocation || tx.purchaseLink || tx.buyerName ? `
                            <div class="bg-brand-dark p-4 rounded-xl border border-brand-muted/10 space-y-3">
                                <h4 class="font-bold text-brand-warning text-sm uppercase tracking-wider mb-2 border-b border-brand-muted/10 pb-2">Informações da Compra</h4>
                                
                                ${tx.purchaseLocation ? `
                                <div>
                                    <p class="text-xs text-brand-muted">Local / Estabelecimento</p>
                                    <p class="text-sm text-white font-medium">${tx.purchaseLocation}</p>
                                </div>` : ''}
                                
                                ${tx.purchaseLink ? `
                                <div>
                                    <p class="text-xs text-brand-muted">Link de Compra</p>
                                    <a href="${tx.purchaseLink.startsWith('http') ? tx.purchaseLink : 'https://'+tx.purchaseLink}" target="_blank" class="text-sm text-brand-accent hover:underline flex items-center gap-1">
                                        Acessar página do produto <i data-lucide="external-link" class="w-3 h-3"></i>
                                    </a>
                                </div>` : ''}
                                
                                ${tx.buyerName ? `
                                <div class="flex items-center gap-2 pt-2 border-t border-brand-muted/5 mt-2">
                                    <div class="bg-brand-panel p-2 rounded-full border border-brand-muted/10"><i data-lucide="user" class="w-4 h-4 text-brand-muted"></i></div>
                                    <div>
                                        <p class="text-xs text-brand-muted">Comprador / Responsável</p>
                                        <p class="text-sm text-white font-bold">${tx.buyerName} ${tx.buyerMatricula ? `<span class="text-xs font-normal text-brand-muted ml-1">(Mat: ${tx.buyerMatricula})</span>` : ''}</p>
                                    </div>
                                </div>` : ''}
                            </div>
                            ` : ''}
                            
                            ${tx.receiptImage ? `
                            <div class="bg-brand-dark p-4 rounded-xl border border-brand-muted/10">
                                <p class="text-sm text-brand-muted mb-3 flex items-center gap-2"><i data-lucide="image" class="w-4 h-4"></i> Foto do Produto / Nota Fiscal</p>
                                <img src="${tx.receiptImage}" class="w-full rounded-lg border border-brand-muted/20 shadow-md" alt="Nota Fiscal ou Produto" />
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>`;
            }

            if (state.showReceiptModal && state.receiptTx) {
                const tx = state.receiptTx;
                
                let matInfo = "N/A";
                if (tx.memberId) {
                    const found = state.members.find(m => m.id === tx.memberId);
                    if (found) matInfo = found.matricula;
                }

                let txTime = "00:00";
                let formattedDate = tx.date || "Sem Data";
                if (tx.createdAt) {
                    const dateObj = new Date(tx.createdAt);
                    if(!isNaN(dateObj)) {
                        txTime = dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                        if(!tx.date) formattedDate = dateObj.toLocaleDateString('pt-BR');
                    }
                }
                
                const monthName = { 'Jan': 'Janeiro', 'Fev': 'Fevereiro', 'Mar': 'Março', 'Abr': 'Abril', 'Mai': 'Maio', 'Jun': 'Junho', 'Jul': 'Julho', 'Ago': 'Agosto', 'Set': 'Setembro', 'Out': 'Outubro', 'Nov': 'Novembro', 'Dez': 'Dezembro' }[tx.month] || tx.month;

                content += `
                <div class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div id="receipt-modal-box" class="bg-brand-panel rounded-2xl w-full max-w-lg shadow-2xl border border-brand-muted/20 relative my-8 flex flex-col max-h-[90vh]">
                        <div class="p-4 border-b border-brand-muted/20 flex justify-between items-center bg-brand-dark rounded-t-2xl shrink-0">
                            <h3 id="receipt-modal-title" class="font-bold text-lg flex items-center gap-2"><i data-lucide="receipt" class="text-brand-accent"></i> Gerar Recibo</h3>
                            <button onclick="closeReceiptModal()" class="text-brand-muted hover:text-white p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        
                        <div id="receipt-scroll-box" class="p-6 overflow-y-auto flex-grow flex flex-col gap-6">
                            
                            ${state.isEditingReceiptSettings ? `
                                <div class="bg-brand-dark p-5 rounded-xl border border-brand-muted/20">
                                    <h4 class="font-bold mb-4 text-brand-accent flex items-center gap-2"><i data-lucide="pen-tool"></i> Dados do Emissor (Ficará Salvo)</h4>
                                    <div class="space-y-4">
                                        <input type="text" id="admin-name-input" value="${state.adminReceiptInfo.name}" placeholder="Nome do Administrador (Ex: SGT Silva)" class="w-full bg-brand-panel border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white"/>
                                        <input type="text" id="admin-mat-input" value="${state.adminReceiptInfo.matricula}" placeholder="Matrícula" class="w-full bg-brand-panel border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white"/>
                                        
                                        <div>
                                            <div class="flex justify-between items-center mb-2">
                                                <label class="text-sm text-brand-muted">Assinatura Digital (Use o dedo na tela)</label>
                                                <button onclick="clearSignature()" class="text-xs text-brand-danger hover:underline">Limpar</button>
                                            </div>
                                            <canvas id="signaturePad" width="600" height="300" class="w-full bg-white rounded-xl border-2 border-brand-muted/30 cursor-crosshair touch-none shadow-inner"></canvas>
                                        </div>
                                        
                                        <button onclick="saveReceiptSettings()" class="w-full bg-brand-accent hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-colors">
                                            Salvar Configurações
                                        </button>
                                    </div>
                                </div>
                            ` : `
                                <div id="edit-receipt-btn-container" class="flex justify-end">
                                    <button onclick="toggleEditReceiptSettings()" class="text-xs text-brand-accent hover:underline flex items-center gap-1"><i data-lucide="edit-3" class="w-3 h-3"></i> Editar Assinatura / Nome</button>
                                </div>

                                <div id="receipt-capture-area" class="bg-white text-black p-8 rounded-sm shadow-sm relative overflow-hidden shrink-0" style="font-family: Arial, sans-serif;">
                                    <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] pointer-events-none">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>
                                    </div>

                                    <div class="text-center border-b-2 border-gray-300 pb-4 mb-6">
                                        <h2 class="text-xl font-black uppercase tracking-wider text-gray-800">Grêmio PIT</h2>
                                        <p class="text-sm font-bold text-gray-500 tracking-widest mt-1">RECIBO DE ${tx.type === 'income' ? 'ARRECADAÇÃO' : 'DESPESA'}</p>
                                    </div>

                                    <div class="space-y-4 text-sm font-medium">
                                        <div class="flex justify-between items-end gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Valor:</span>
                                            <span class="font-black text-lg text-right ${tx.type === 'income' ? 'text-green-700' : 'text-red-700'}">${formatCurrency(tx.amount)}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Contribuinte:</span>
                                            <span class="font-bold text-gray-800 text-right uppercase">${tx.description}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Matrícula:</span>
                                            <span class="font-bold text-gray-800 text-right">${matInfo}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Data / Hora:</span>
                                            <span class="font-bold text-gray-800 text-right">${formattedDate} às ${txTime}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-4 pb-2">
                                            <span class="text-gray-500 shrink-0">Mês de Competência:</span>
                                            <span class="font-bold text-gray-800 text-right uppercase">${monthName}</span>
                                        </div>
                                    </div>

                                    <div class="mt-10 pt-6 border-t-2 border-gray-300 text-center flex flex-col items-center">
                                        ${state.adminReceiptInfo.signatureDataUrl ? `<img src="${state.adminReceiptInfo.signatureDataUrl}" class="h-16 object-contain mb-1" />` : '<div class="h-16 mb-1"></div>'}
                                        <div class="w-48 border-t border-gray-800 mb-2"></div>
                                        <p class="font-bold text-gray-900 uppercase text-xs">${state.adminReceiptInfo.name || 'Nome do Responsável'}</p>
                                        <p class="text-xs text-gray-500 font-bold">Mat: ${state.adminReceiptInfo.matricula || '000000'}</p>
                                        <p class="text-[10px] text-gray-400 mt-4 italic">Documento emitido eletronicamente via Sistema PIT.</p>
                                    </div>
                                </div>

                                <button id="btn-share-receipt" onclick="shareReceiptImage()" class="w-full bg-[#10B981] hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2 mt-2">
                                    <i data-lucide="share-2" class="w-5 h-5"></i> Enviar Imagem no WhatsApp
                                </button>
                            `}
                        </div>
                    </div>
                </div>`;
            }

            app.innerHTML = content;
            lucide.createIcons();

            if (state.showReceiptModal && state.isEditingReceiptSettings) {
                initSignatureCanvas();
            }
        }
        
        render();
    </script>
</body>
</html>
