
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio PIT - Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#020617',
                            panel: '#0F172A',
                            text: '#F8FAFC',
                            muted: '#94A3B8',
                            accent: '#3B82F6',
                            success: '#10B981',
                            danger: '#EF4444',
                            warning: '#EAB308'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #F8FAFC; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .falling-item {
            position: absolute;
            top: -10%;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
        }

        @keyframes fadeInAlert {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInAlert 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-brand-dark min-h-screen text-brand-text flex flex-col md:flex-row md:h-screen md:overflow-hidden relative">
    
    <div id="bg-animation" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>
    <div id="app" class="w-full flex flex-col md:flex-row h-full relative z-10"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('bg-animation');
            const items = ['🚓', '🔗', '🔫', '🚨', '🚔', '🛡️', '👮‍♂️'];
            const numItems = 20;
            for (let i = 0; i < numItems; i++) {
                let el = document.createElement('div');
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.className = 'falling-item';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 15 + 10) + 's'; 
                el.style.animationDelay = (Math.random() * 10) + 's';
                el.style.fontSize = (Math.random() * 15 + 20) + 'px';
                el.style.opacity = '0.05';
                container.appendChild(el);
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBs6l1WQx4ePd2IkY0RdfxR75XCJm13m08",
          authDomain: "gremiopit-3250c.firebaseapp.com",
          projectId: "gremiopit-3250c",
          storageBucket: "gremiopit-3250c.firebasestorage.app",
          messagingSenderId: "22286724105",
          appId: "1:22286724105:web:836befe594b969ccf09cd8",
          measurementId: "G-2CME0BPYLQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const APP_ID = 'gremiopit-v1';
        
        // TRADUTOR DE MESES: Garante que os registros salvos como "Ago", "Set" sejam lidos como "Agosto", "Setembro" sem perder dados
        const MONTH_MAP = {
            'Jan': 'Janeiro', 'Fev': 'Fevereiro', 'Mar': 'Março', 'Abr': 'Abril',
            'Mai': 'Maio', 'Jun': 'Junho', 'Jul': 'Julho', 'Ago': 'Agosto',
            'Set': 'Setembro', 'Out': 'Outubro', 'Nov': 'Novembro', 'Dez': 'Dezembro'
        };
        const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const currentMonthName = MONTHS[new Date().getMonth()];
        
        let state = {
            activeTab: 'dashboard',
            selectedMonth: currentMonthName,
            user: null,
            isAdmin: false,
            members: [],
            transactions: [],
            logs: [], 
            showLoginModal: false,
            loginEmail: '',
            loginPassword: '',
            loginError: '',
            isResetting: false,
            dbError: null,
            
            membersViewMode: window.innerWidth < 768 ? 'monthly' : 'panorama', 
            showReceiptModal: false,
            receiptTx: null,
            isEditingReceiptSettings: false,
            adminReceiptInfo: JSON.parse(localStorage.getItem('gremio_admin_receipt_info') || '{"name":"","matricula":"","signatureDataUrl":""}'),
            generatedReceiptFile: null,

            expenseImageBase64: null,
            showDetailsModal: false,
            detailsTx: null,
            showPassword: false,

            showEditTxModal: false,
            editTxData: {},
            editingTxId: null,
            
            memberSearchQuery: '',
            memberPaymentFilter: 'all',
            editingMemberId: null,
            editMemberData: { rank: '', name: '', matricula: '' },
            
            showLogsModal: false
        };

        window.state = state;

        window.alert = (message) => {
            const modal = document.createElement('div');
            modal.className = 'fixed top-4 right-4 bg-brand-panel border-l-4 border-brand-accent text-white p-4 rounded shadow-2xl z-[9999] flex items-center gap-3 animate-fade-in';
            modal.innerHTML = `<i data-lucide="info" class="text-brand-accent"></i> <div>${message}</div>`;
            document.body.appendChild(modal);
            if(window.lucide) lucide.createIcons({root: modal});
            setTimeout(() => modal.remove(), 5000);
        };

        let unsubMembers = null;
        let unsubTrans = null;
        let unsubLogs = null;
        let isTransitioningAuth = false;

        const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

        const logAction = async (actionText) => {
            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'logs'), {
                    action: actionText,
                    date: new Date().toLocaleString('pt-BR'),
                    createdAt: Date.now()
                });
            } catch (error) { console.error("Erro ao salvar log", error); }
        };

        // Função Raio-X Inteligente Aprimorada (Corrige vínculo de pagamentos antigos)
        const matchMemberToTx = (tx) => {
            if (!tx) return null;
            if (tx.memberId) {
                const m = state.members.find(x => x.id === tx.memberId);
                if (m) return m;
            }
            const tDescLower = String(tx.description || '').toLowerCase();
            
            // Filtro que remove acentos, patentes (SGT, CB, SD) e caracteres especiais para igualar as palavras
            const normalize = (str) => {
                return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                          .replace(/[^a-z0-9 ]/g, "")
                          .replace(/\b(sd|cb|sgt|3 sgt|2 sgt|1 sgt|st|ten|cap|maj|tc|cel)\b/g, "")
                          .replace(/\s+/g, " ").trim();
            };
            
            const normDesc = normalize(tDescLower);

            return state.members.find(m => {
                const normName = normalize(String(m.name || '').toLowerCase());
                if(!normName || !normDesc) return false;
                
                return normName === normDesc || 
                       (normName.length > 3 && normDesc.includes(normName)) ||
                       (normDesc.length > 3 && normName.includes(normDesc));
            });
        };

        function setupListeners() {
            if (unsubMembers) unsubMembers();
            if (unsubTrans) unsubTrans();
            if (unsubLogs) unsubLogs(); 

            const membersRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'members');
            const transRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions');
            const logsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'logs');

            unsubMembers = onSnapshot(membersRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.members = snapshot.docs.map(doc => {
                    let d = doc.data();
                    // AUTOCURA DOS MESES: Traduz 'Ago' para 'Agosto' na listagem de pagamentos do Policial
                    if(d.payments) {
                        let healedPayments = {};
                        Object.keys(d.payments).forEach(k => {
                            let newKey = MONTH_MAP[k] || k;
                            healedPayments[newKey] = d.payments[k];
                        });
                        d.payments = healedPayments;
                    }
                    return { id: doc.id, ...d };
                }).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                state.dbError = null;
                render();
            }, (error) => {
                if(isTransitioningAuth) return;
                if(error.code === 'permission-denied') state.dbError = 'permission';
                render();
            });

            unsubTrans = onSnapshot(transRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.transactions = snapshot.docs.map(doc => {
                    let d = doc.data();
                    // AUTOCURA DOS MESES: Traduz 'Ago' para 'Agosto' nas transações financeiras
                    if(MONTH_MAP[d.month]) d.month = MONTH_MAP[d.month];
                    return { id: doc.id, ...d };
                }).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                state.dbError = null;
                render();
            }, (error) => {
                if(isTransitioningAuth) return;
                if(error.code === 'permission-denied') state.dbError = 'permission';
                render();
            });

            unsubLogs = onSnapshot(logsRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); 
                render();
            });
        }

        onAuthStateChanged(auth, (user) => {
            isTransitioningAuth = false;
            if (user) {
                state.user = user;
                state.isAdmin = !user.isAnonymous; 
                setupListeners();
            } else {
                state.user = null;
                state.isAdmin = false;
                signInAnonymously(auth).catch((err) => {
                    console.warn("Autenticação anônima desabilitada.");
                    state.dbError = 'auth-anon-disabled';
                    render();
                });
            }
            render();
        });

        window.handleLogin = async (e) => {
            e.preventDefault();
            state.loginError = '';
            render();
            try {
                await signInWithEmailAndPassword(auth, state.loginEmail, state.loginPassword);
                state.showLoginModal = false;
                state.loginEmail = '';
                state.loginPassword = '';
            } catch (error) {
                state.loginError = 'E-mail ou senha incorretos.';
                render();
            }
        };

        window.handleResetPassword = async (e) => {
            e.preventDefault();
            if(!state.loginEmail) {
                state.loginError = 'Digite seu e-mail para recuperar.';
                render();
                return;
            }
            try {
                await sendPasswordResetEmail(auth, state.loginEmail);
                state.loginError = 'E-mail enviado! Verifique sua caixa de entrada.';
                render();
            } catch(error) {
                state.loginError = 'Erro ao enviar. O e-mail está correto?';
                render();
            }
        };

        window.handleLogout = async () => {
            isTransitioningAuth = true;
            if(unsubMembers) unsubMembers();
            if(unsubTrans) unsubTrans();
            if(unsubLogs) unsubLogs();
            await signOut(auth);
        };

        window.handleAddMember = async (e) => {
            e.preventDefault();
            const rank = document.getElementById('newMemberRank').value;
            const name = document.getElementById('newMemberName').value.trim();
            const mat = document.getElementById('newMemberMatricula').value.trim();
            if (!name || !mat || !state.user) return;
            
            const exists = state.members.find(m => m.matricula === mat || m.name.toLowerCase() === name.toLowerCase());
            if (exists) {
                alert(`Policial já cadastrado! Verifique: ${exists.rank || ''} ${exists.name}`);
                return;
            }

            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'members'), {
                    rank: rank,
                    name: name,
                    matricula: mat,
                    payments: {},
                    createdAt: Date.now()
                });
                logAction(`Novo Policial adicionado: ${rank} ${name}`);
            } catch (error) { console.error(error); }
        };

        window.startEditMember = (id) => {
            const member = state.members.find(m => m.id === id);
            if(!member) return;
            state.editingMemberId = id;
            state.editMemberData = { rank: member.rank || '', name: member.name || '', matricula: member.matricula || '' };
            render();
        };

        window.cancelEditMember = () => {
            state.editingMemberId = null;
            render();
        };

        window.saveEditMember = async (e) => {
            e.preventDefault();
            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', state.editingMemberId), {
                    rank: state.editMemberData.rank,
                    name: state.editMemberData.name,
                    matricula: state.editMemberData.matricula
                });
                logAction(`Policial atualizado: ${state.editMemberData.rank} ${state.editMemberData.name}`);
                state.editingMemberId = null;
            } catch(e) { console.error(e); }
        };

        window.togglePayment = async (memberId, month) => {
            if (!state.user || !state.isAdmin) return;
            const member = state.members.find(m => m.id === memberId);
            if (!member) return;
            
            const existingTx = state.transactions.find(t => t.type === 'income' && t.month === month && (t.memberId === member.id || matchMemberToTx(t)?.id === member.id));

            const isCurrentlyPaid = (member.payments || {})[month] || !!existingTx;
            const newStatus = !isCurrentlyPaid;

            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', memberId), {
                    [`payments.${month}`]: newStatus
                });

                if (newStatus) {
                    if (!existingTx) {
                        await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions'), {
                            type: 'income',
                            description: member.name, 
                            amount: 10,
                            month: month,
                            date: new Date().toLocaleDateString('pt-BR'),
                            isAuto: true,
                            memberId: member.id,
                            createdAt: Date.now()
                        });
                        logAction(`Pagamento confirmado: ${member.rank || ''} ${member.name} (${month})`);
                    }
                } else {
                    if (existingTx) {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'transactions', existingTx.id));
                        logAction(`Pagamento estornado: ${member.rank || ''} ${member.name} (${month})`);
                    }
                }
            } catch (error) { console.error(error); }
        };

        window.handleDeleteMember = async (id) => {
            if (!state.user || !state.isAdmin) return;
            const member = state.members.find(m => m.id === id);
            try { 
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', id)); 
                if(member) logAction(`Policial removido: ${member.rank || ''} ${member.name}`);
            } catch(e) {}
        };

        window.toggleExpenseFields = () => {
            const type = document.querySelector('input[name="transType"]:checked').value;
            const extraFields = document.getElementById('expenseExtraFields');
            if (extraFields) {
                if (type === 'expense') extraFields.classList.remove('hidden');
                else extraFields.classList.add('hidden');
            }
        };

        window.toggleInstallmentFields = (isEdit = false) => {
            const prefix = isEdit ? 'editTrans' : 'newTrans';
            const checkbox = document.getElementById(`${prefix}IsInstallment`);
            const fields = document.getElementById(`${prefix}InstallmentFields`);
            if(checkbox && fields) {
                if(checkbox.checked) fields.classList.remove('hidden');
                else fields.classList.add('hidden');
            }
        };

        window.openEditTxModal = (id) => {
            const tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            state.editingTxId = id;
            state.editTxData = { ...tx };
            state.showEditTxModal = true;
            render();
        };

        window.closeEditTxModal = () => {
            state.showEditTxModal = false;
            state.editingTxId = null;
            render();
        };

        window.saveEditTx = async (e) => {
            e.preventDefault();
            if(!state.editingTxId) return;
            
            const isInst = document.getElementById('editTransIsInstallment')?.checked || false;
            
            const updatedData = {
                description: document.getElementById('editTransDesc').value,
                amount: parseFloat(document.getElementById('editTransAmount').value),
                date: document.getElementById('editTransDate').value || state.editTxData.date,
                isInstallment: isInst,
                totalAmount: isInst ? parseFloat(document.getElementById('editTransTotalAmount').value || 0) : 0,
                currentInstallment: isInst ? parseInt(document.getElementById('editTransCurrentInst').value || 1) : 1,
                totalInstallments: isInst ? parseInt(document.getElementById('editTransTotalInst').value || 1) : 1
            };

            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'transactions', state.editingTxId), updatedData);
                logAction(`Despesa atualizada com sucesso: ${updatedData.description}`);
                closeEditTxModal();
            } catch(err) { console.error(err); }
        };

        window.handleExpenseImage = (e) => {
            const file = e.target.files[0];
            if (!file) { state.expenseImageBase64 = null; return; }
            
            if (file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = (event) => {
                    state.expenseImageBase64 = event.target.result;
                };
                reader.readAsDataURL(file);
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 800; 
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    state.expenseImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.openDetailsModal = (id) => {
            const tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            state.detailsTx = tx;
            state.showDetailsModal = true;
            render();
        };

        window.closeDetailsModal = () => {
            state.showDetailsModal = false;
            state.detailsTx = null;
            render();
        };

        window.viewPDF = (id) => {
            const tx = state.transactions.find(t => t.id === id);
            if (!tx || !tx.receiptImage) return;
            const container = document.getElementById(`pdf-viewer-container-${id}`);
            const btn = document.getElementById(`btn-view-pdf-${id}`);

            if (container) {
                if (!container.classList.contains('hidden')) {
                    container.classList.add('hidden');
                    container.innerHTML = '';
                    if (btn) btn.innerHTML = '<i data-lucide="eye" class="w-5 h-5"></i> Visualizar na Tela';
                    if (window.lucide) lucide.createIcons();
                    return;
                }
                try {
                    const base64Data = tx.receiptImage.split(',')[1];
                    if (!base64Data) return;
                    
                    const byteCharacters = atob(base64Data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], {type: 'application/pdf'});
                    const blobUrl = URL.createObjectURL(blob);
                    
                    container.classList.remove('hidden');
                    container.innerHTML = `<iframe src="${blobUrl}#view=FitH" class="w-full h-full border-none bg-white"></iframe>`;
                    
                    if (btn) btn.innerHTML = '<i data-lucide="eye-off" class="w-5 h-5"></i> Ocultar PDF';
                    if (window.lucide) lucide.createIcons();
                } catch (e) {
                    console.error("Erro ao gerar visualização do PDF: ", e);
                    alert("Não foi possível renderizar a visualização. Tente baixar o arquivo.");
                }
            }
        };

        window.togglePassword = () => {
            state.showPassword = !state.showPassword;
            render();
        };

        window.handleAddTransaction = async (e) => {
            e.preventDefault();
            const type = document.querySelector('input[name="transType"]:checked').value;
            const desc = document.getElementById('newTransDesc').value;
            const amount = document.getElementById('newTransAmount').value;
            const dateInput = document.getElementById('newTransDate').value;
            
            if (!desc || !amount || !state.user) return;
            
            let formattedDate = new Date().toLocaleDateString('pt-BR');
            let timestamp = Date.now();
            if (dateInput) {
                const d = new Date(dateInput);
                formattedDate = d.toLocaleDateString('pt-BR');
                timestamp = d.getTime();
            }

            let extraData = {};
            if (type === 'expense') {
                const isInst = document.getElementById('newTransIsInstallment')?.checked || false;
                extraData = {
                    purchaseLocation: document.getElementById('newTransLocation')?.value || '',
                    purchaseLink: document.getElementById('newTransLink')?.value || '',
                    buyerName: document.getElementById('newTransBuyerName')?.value || '',
                    buyerMatricula: document.getElementById('newTransBuyerMat')?.value || '',
                    receiptImage: state.expenseImageBase64 || null,
                    isInstallment: isInst,
                    totalAmount: isInst ? parseFloat(document.getElementById('newTransTotalAmount').value || 0) : 0,
                    currentInstallment: isInst ? parseInt(document.getElementById('newTransCurrentInst').value || 1) : 1,
                    totalInstallments: isInst ? parseInt(document.getElementById('newTransTotalInst').value || 1) : 1
                };
            }

            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions'), {
                    type,
                    description: desc,
                    amount: parseFloat(amount),
                    month: state.selectedMonth,
                    date: formattedDate,
                    createdAt: timestamp,
                    ...extraData
                });
                logAction(`Registro (${type === 'income' ? 'Receita' : 'Despesa'}): ${desc} - R$ ${amount}`);
                
                document.getElementById('newTransDesc').value = '';
                document.getElementById('newTransAmount').value = '';
                document.getElementById('newTransDate').value = '';

                if (type === 'expense') {
                    if(document.getElementById('newTransLocation')) document.getElementById('newTransLocation').value = '';
                    if(document.getElementById('newTransLink')) document.getElementById('newTransLink').value = '';
                    if(document.getElementById('newTransBuyerName')) document.getElementById('newTransBuyerName').value = '';
                    if(document.getElementById('newTransBuyerMat')) document.getElementById('newTransBuyerMat').value = '';
                    if(document.getElementById('newTransPhoto')) document.getElementById('newTransPhoto').value = '';
                    
                    if(document.getElementById('newTransIsInstallment')) document.getElementById('newTransIsInstallment').checked = false;
                    if(document.getElementById('newTransTotalAmount')) document.getElementById('newTransTotalAmount').value = '';
                    if(document.getElementById('newTransCurrentInst')) document.getElementById('newTransCurrentInst').value = '';
                    if(document.getElementById('newTransTotalInst')) document.getElementById('newTransTotalInst').value = '';
                    const instFields = document.getElementById('newTransInstallmentFields');

        window.initSignatureCanvas = () => {
            const canvas = document.getElementById('signaturePad');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#020617'; 
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            let drawing = false;

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(state.adminReceiptInfo.signatureDataUrl) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = state.adminReceiptInfo.signatureDataUrl;
            }

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const start = (e) => { 
                e.preventDefault(); 
                if(document.activeElement) document.activeElement.blur(); 
                drawing = true; 
                const pos = getPos(e); 
                ctx.beginPath(); 
                ctx.moveTo(pos.x, pos.y); 
            };
            const draw = (e) => { e.preventDefault(); if(!drawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
            const stop = (e) => { e.preventDefault(); drawing = false; };

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop);
            canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stop);

                                ${tx.buyerName ? `
                                <div class="flex items-center gap-2 pt-2 border-t border-brand-muted/5 mt-2">
                                    <div class="bg-brand-panel p-2 rounded-full border border-brand-muted/10"><i data-lucide="user" class="w-3 h-3 md:w-4 md:h-4 text-brand-muted"></i></div>
                                    <div>
                                        <p class="text-[10px] md:text-xs text-brand-muted">Comprador / Responsável</p>
                                        <p class="text-xs md:text-sm text-white font-bold whitespace-normal break-words">${tx.buyerName} ${tx.buyerMatricula ? `<span class="font-normal text-brand-muted ml-1">(Mat: ${tx.buyerMatricula})</span>` : ''}</p>
                                    </div>
                                </div>` : ''}
                            </div>
                            ` : ''}
                            
                            ${tx.receiptImage ? `
                            <div class="bg-brand-dark p-4 rounded-xl border border-brand-muted/10">
                                <p class="text-xs md:text-sm text-brand-muted mb-3 flex items-center gap-2"><i data-lucide="image" class="w-4 h-4"></i> Foto do Produto / Nota Fiscal</p>
                                ${tx.receiptImage.startsWith('data:application/pdf') ? `
                                    <div class="flex flex-col items-center justify-center p-4 md:p-6 border-2 border-dashed border-brand-muted/20 rounded-lg bg-brand-panel transition-all">
                                        <i data-lucide="file-text" class="w-10 h-10 md:w-12 md:h-12 text-brand-danger mb-3"></i>
                                        <p class="text-white font-bold mb-4 text-sm md:text-base">Documento PDF Anexado</p>
                                        <div class="flex flex-col sm:flex-row gap-2 md:gap-3 w-full justify-center">
                                            <a href="${tx.receiptImage}" download="comprovante.pdf" class="bg-brand-danger hover:bg-red-600 text-white font-bold py-2 px-4 md:px-6 rounded-lg transition-colors flex items-center justify-center gap-2 text-xs md:text-sm">
                                                <i data-lucide="download" class="w-4 h-4 md:w-5 md:h-5"></i> Baixar PDF
                                            </a>
                                            <button onclick="viewPDF('${tx.id}')" id="btn-view-pdf-${tx.id}" class="bg-brand-dark border border-brand-muted/30 hover:bg-brand-muted/10 text-white font-bold py-2 px-4 md:px-6 rounded-lg transition-colors flex items-center justify-center gap-2 text-xs md:text-sm">
                                                <i data-lucide="eye" class="w-4 h-4 md:w-5 md:h-5"></i> Visualizar
                                            </button>
                                        </div>
                                    </div>
                                    <div id="pdf-viewer-container-${tx.id}" class="hidden w-full h-[50vh] md:h-[60vh] mt-4 rounded-xl overflow-hidden border-2 border-brand-muted/20 bg-white"></div>
                                ` : `
                                    <img src="${tx.receiptImage}" class="w-full rounded-lg border border-brand-muted/20 shadow-md" alt="Nota Fiscal ou Produto" />
                                `}
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>`;
            }

            if (state.showEditTxModal && state.editTxData) {
                const tx = state.editTxData;
                content += `
                <div class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[999] flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-brand-panel rounded-2xl w-full max-w-lg shadow-2xl border border-brand-muted/20 relative my-8 flex flex-col max-h-[90vh]">
                        <div class="p-4 border-b border-brand-muted/20 flex justify-between items-center bg-brand-dark rounded-t-2xl shrink-0">
                            <h3 class="font-bold text-base md:text-lg flex items-center gap-2 text-blue-400"><i data-lucide="edit" class="w-5 h-5"></i> Editar Despesa</h3>
                            <button onclick="closeEditTxModal()" class="text-brand-muted hover:text-white p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="p-4 md:p-6 overflow-y-auto flex-grow">
                            <form onsubmit="saveEditTx(event)" class="space-y-4">
                                <div>
                                    <label class="text-xs font-bold text-brand-muted">Descrição</label>
                                    <input type="text" id="editTransDesc" value="${tx.description}" class="w-full bg-brand-dark border border-brand-muted/20 outline-none focus:ring-1 focus:ring-brand-accent rounded-xl px-4 py-3 text-white mt-1" required/>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-xs font-bold text-brand-muted">Valor da Saída/Parcela (R$)</label>
                                        <input type="number" step="0.01" id="editTransAmount" value="${tx.amount}" class="w-full bg-brand-dark border border-brand-muted/20 outline-none focus:ring-1 focus:ring-brand-accent rounded-xl px-4 py-3 text-brand-danger font-bold mt-1" required/>
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-brand-muted">Data (opcional alterar)</label>
                                        <input type="text" id="editTransDate" value="${tx.date}" class="w-full bg-brand-dark border border-brand-muted/20 outline-none focus:ring-1 focus:ring-brand-accent rounded-xl px-4 py-3 text-white mt-1"/>
                                    </div>
                                </div>
                                
                                <div class="bg-brand-dark/50 p-4 rounded-xl border border-brand-muted/20 mt-2">
                                    <label class="flex items-center gap-2 cursor-pointer text-sm font-bold text-brand-accent">
                                        <input type="checkbox" id="editTransIsInstallment" onchange="toggleInstallmentFields(true)" ${tx.isInstallment ? 'checked' : ''} class="w-4 h-4 accent-brand-accent rounded cursor-pointer"/>
                                        📦 Compra Parcelada?
                                    </label>
                                    
                                    <div id="editTransInstallmentFields" class="${tx.isInstallment ? 'grid' : 'hidden'} grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4 mt-4 pt-4 border-t border-brand-muted/10">
                                        <div>
                                            <label class="text-[10px] md:text-xs text-brand-muted font-bold">Valor Total</label>
                                            <input type="number" step="0.01" id="editTransTotalAmount" value="${tx.totalAmount || ''}" placeholder="1200.00" class="w-full bg-brand-dark border border-brand-muted/20 outline-none focus:ring-1 focus:ring-brand-accent rounded-xl px-3 py-2 text-white text-sm mt-1"/>
                                        </div>
                                        <div>
                                            <label class="text-[10px] md:text-xs text-brand-muted font-bold">Parcela Atual</label>
                                            <input type="number" id="editTransCurrentInst" value="${tx.currentInstallment || ''}" placeholder="1" class="w-full bg-brand-dark border border-brand-muted/20 outline-none focus:ring-1 focus:ring-brand-accent rounded-xl px-3 py-2 text-white text-sm mt-1"/>
                                        </div>
                                        <div>
                                            <label class="text-[10px] md:text-xs text-brand-muted font-bold">Qtd Parcelas</label>
                                            <input type="number" id="editTransTotalInst" value="${tx.totalInstallments || ''}" placeholder="10" class="w-full bg-brand-dark border border-brand-muted/20 outline-none focus:ring-1 focus:ring-brand-accent rounded-xl px-3 py-2 text-white text-sm mt-1"/>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="w-full bg-brand-accent hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 mt-4">
                                    <i data-lucide="save" class="w-5 h-5"></i> Salvar Alterações
                                </button>
                            </form>
                        </div>
                    </div>
                </div>`;
            }

            if (state.showReceiptModal && state.receiptTx) {
                const tx = state.receiptTx;
                
                let matInfo = "N/A";
                let displayName = tx.description; 
                
                // Raio-X Inteligente para recibos antigos: Cruza o nome da transação velha com o cadastro atualizado
                const memberRef = matchMemberToTx(tx);

                if (memberRef) {
                    matInfo = memberRef.matricula;
                    displayName = memberRef.rank ? `${memberRef.rank} ${memberRef.name}` : memberRef.name;
                }

                let txTime = "00:00";
                let formattedDate = tx.date || "Sem Data";
                if (tx.createdAt) {
                    const dateObj = new Date(tx.createdAt);
                    if(!isNaN(dateObj)) {
                        txTime = dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                        if(!tx.date) formattedDate = dateObj.toLocaleDateString('pt-BR');
                    }
                }
                
                const monthName = tx.month;

                content += `
                <div class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[999] flex items-center justify-center p-4 overflow-y-auto">
                    <div id="receipt-modal-box" class="bg-brand-panel rounded-2xl w-full max-w-lg shadow-2xl border border-brand-muted/20 relative my-8 flex flex-col max-h-[90vh]">
                        <div class="p-4 border-b border-brand-muted/20 flex justify-between items-center bg-brand-dark rounded-t-2xl shrink-0">
                            <h3 id="receipt-modal-title" class="font-bold text-base md:text-lg flex items-center gap-2"><i data-lucide="receipt" class="text-brand-accent"></i> Gerar Recibo</h3>
                            <button onclick="closeReceiptModal()" class="text-brand-muted hover:text-white p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        
                        <div id="receipt-scroll-box" class="p-4 md:p-6 overflow-y-auto flex-grow flex flex-col gap-4 md:gap-6">
                            
                            ${state.isEditingReceiptSettings ? `
                                <div class="bg-brand-dark p-4 md:p-5 rounded-xl border border-brand-muted/20">
                                    <h4 class="font-bold mb-4 text-brand-accent flex items-center gap-2 text-sm md:text-base"><i data-lucide="pen-tool"></i> Dados do Emissor (Ficará Salvo)</h4>
                                    <div class="space-y-4">
                                        <input type="text" id="admin-name-input" value="${state.adminReceiptInfo.name}" placeholder="Nome do Adm (Ex: SGT Silva)" class="w-full bg-brand-panel border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white text-sm md:text-base"/>
                                        <input type="text" id="admin-mat-input" value="${state.adminReceiptInfo.matricula}" placeholder="Matrícula" class="w-full bg-brand-panel border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white text-sm md:text-base"/>
                                        
                                        <div>
                                            <div class="flex justify-between items-center mb-2">
                                                <label class="text-xs md:text-sm text-brand-muted">Assinatura Digital (Use o dedo na tela)</label>
                                                <button onclick="clearSignature()" class="text-[10px] md:text-xs text-brand-danger hover:underline">Limpar</button>
                                            </div>
                                            <canvas id="signaturePad" width="600" height="300" class="w-full bg-white rounded-xl border-2 border-brand-muted/30 cursor-crosshair touch-none shadow-inner"></canvas>
                                        </div>
                                        
                                        <button onclick="saveReceiptSettings()" class="w-full bg-brand-accent hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-colors text-sm md:text-base">
                                            Salvar Configurações
                                        </button>
                                    </div>
                                </div>
                            ` : `
                                <div id="edit-receipt-btn-container" class="flex justify-end">
                                    <button onclick="toggleEditReceiptSettings()" class="text-[10px] md:text-xs text-brand-accent hover:underline flex items-center gap-1"><i data-lucide="edit-3" class="w-3 h-3"></i> Editar Assinatura / Nome</button>
                                </div>

                                <div id="receipt-capture-area" class="bg-white text-black p-6 md:p-8 rounded-sm shadow-sm relative overflow-hidden shrink-0" style="font-family: Arial, sans-serif;">
                                    <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] pointer-events-none">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>
                                    </div>

                                    <div class="text-center border-b-2 border-gray-300 pb-4 mb-4 md:mb-6">
                                        <h2 class="text-lg md:text-xl font-black uppercase tracking-wider text-gray-800">Grêmio PIT</h2>
                                        <p class="text-xs md:text-sm font-bold text-gray-500 tracking-widest mt-1">RECIBO DE ${tx.type === 'income' ? 'ARRECADAÇÃO' : 'DESPESA'}</p>
                                    </div>

                                    <div class="space-y-3 md:space-y-4 text-xs md:text-sm font-medium">
                                        <div class="flex justify-between items-end gap-2 md:gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Valor:</span>
                                            <span class="font-black text-base md:text-lg text-right ${tx.type === 'income' ? 'text-green-700' : 'text-red-700'}">${formatCurrency(tx.amount)}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-2 md:gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Contribuinte:</span>
                                            <span class="font-bold text-gray-800 text-right uppercase whitespace-normal break-words">${displayName}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-2 md:gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Matrícula:</span>
                                            <span class="font-bold text-gray-800 text-right">${matInfo}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-2 md:gap-4 border-b border-gray-100 pb-2">
                                            <span class="text-gray-500 shrink-0">Data / Hora:</span>
                                            <span class="font-bold text-gray-800 text-right">${formattedDate} às ${txTime}</span>
                                        </div>
                                        <div class="flex justify-between items-end gap-2 md:gap-4 pb-2">
                                            <span class="text-gray-500 shrink-0">Competência:</span>
                                            <span class="font-bold text-gray-800 text-right uppercase">${monthName}</span>
                                        </div>
                                    </div>

                                    <div class="mt-8 md:mt-10 pt-4 md:pt-6 border-t-2 border-gray-300 text-center flex flex-col items-center">
                                        ${state.adminReceiptInfo.signatureDataUrl ? `<img src="${state.adminReceiptInfo.signatureDataUrl}" class="h-12 md:h-16 object-contain mb-1" />` : '<div class="h-12 md:h-16 mb-1"></div>'}
                                        <div class="w-40 md:w-48 border-t border-gray-800 mb-2"></div>
                                        <p class="font-bold text-gray-900 uppercase text-[10px] md:text-xs">${state.adminReceiptInfo.name || 'Nome do Responsável'}</p>
                                        <p class="text-[10px] md:text-xs text-gray-500 font-bold">Mat: ${state.adminReceiptInfo.matricula || '000000'}</p>
                                        <p class="text-[8px] md:text-[10px] text-gray-400 mt-4 italic">Documento emitido eletronicamente via Sistema PIT.</p>
                                    </div>
                                </div>

                                <button id="btn-share-receipt" onclick="shareReceiptImage()" class="w-full bg-[#10B981] hover:bg-green-600 text-white font-bold py-3 md:py-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2 mt-2 text-sm md:text-base">
                                    <i data-lucide="share-2" class="w-4 h-4 md:w-5 md:h-5"></i> Enviar no WhatsApp
                                </button>
                            `}
                        </div>
                    </div>
                </div>`;
            }

            if (state.showLogsModal) {
                content += `
                <div class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[999] flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-brand-panel rounded-2xl w-full max-w-2xl shadow-2xl border border-brand-muted/20 relative my-8 flex flex-col max-h-[90vh]">
                        <div class="p-4 border-b border-brand-muted/20 flex justify-between items-center bg-brand-dark rounded-t-2xl shrink-0">
                            <h3 class="font-bold text-base md:text-lg flex items-center gap-2 text-white"><i data-lucide="history" class="text-brand-accent w-5 h-5"></i> Registro de Atividades</h3>
                            <button onclick="closeLogsModal()" class="text-brand-muted hover:text-white p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="p-4 md:p-6 overflow-y-auto flex-grow space-y-3">
                            ${state.logs.length === 0 ? `
                                <div class="text-center py-12 text-brand-muted bg-brand-dark/30 rounded-xl border border-dashed border-brand-muted/20">
                                    <i data-lucide="shield-check" class="w-10 h-10 md:w-12 md:h-12 mx-auto mb-3 opacity-50 text-[#EAB308]"></i>
                                    <p class="text-sm">Nenhuma atividade recente.</p>
                                </div>
                            ` : state.logs.slice(0, 50).map(log => `
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 md:p-4 bg-brand-dark/50 rounded-xl border border-brand-muted/10 hover:border-brand-muted/30 transition-all">
                                    <div class="flex items-center gap-3 mb-2 sm:mb-0">
                                        <div class="bg-brand-panel p-2 rounded-lg border border-brand-muted/20 shrink-0">
                                            <i data-lucide="terminal" class="text-[#EAB308] w-4 h-4 md:w-5 md:h-5"></i>
                                        </div>
                                        <p class="text-white text-xs md:text-sm whitespace-normal break-words">${log.action}</p>
                                    </div>
                                    <div class="flex items-center gap-2 text-brand-muted text-[10px] md:text-xs bg-brand-panel px-2 md:px-3 py-1.5 rounded-lg border border-brand-muted/10 shrink-0">
                                        <i data-lucide="clock" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
                                        ${log.date}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
            }

            app.innerHTML = content;
            lucide.createIcons();

            if (state.showReceiptModal && state.isEditingReceiptSettings) {
                initSignatureCanvas();
            }
        }
        
        render();
    </script>
</body>
</html>
