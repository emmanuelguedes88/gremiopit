<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio PIT - Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0F172A',
                            panel: '#1E293B',
                            text: '#F8FAFC',
                            muted: '#94A3B8',
                            accent: '#3B82F6',
                            success: '#10B981',
                            danger: '#F43F5E',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; }
        /* Scrollbar customizada e elegante */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        /* Remove setas de input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-brand-dark min-h-screen text-brand-text flex flex-col md:flex-row md:h-screen md:overflow-hidden">
    
    <!-- Div onde toda a interface será injetada -->
    <div id="app" class="w-full flex flex-col md:flex-row h-full"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        // Substitua por suas configurações do Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyBs6l1WQx4ePd2IkY0RdfxR75XCJm13m08",
          authDomain: "gremiopit-3250c.firebaseapp.com",
          projectId: "gremiopit-3250c",
          storageBucket: "gremiopit-3250c.firebasestorage.app",
          messagingSenderId: "22286724105",
          appId: "1:22286724105:web:836befe594b969ccf09cd8",
          measurementId: "G-2CME0BPYLQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const APP_ID = 'gremiopit-v1';
        
        const MONTHS = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        
        let state = {
            activeTab: 'dashboard',
            selectedMonth: 'Jan',
            user: null,
            isAdmin: false,
            members: [],
            transactions: [],
            showLoginModal: false,
            loginEmail: '',
            loginPassword: '',
            loginError: '',
            isResetting: false,
            dbError: null
        };

        // Exposing state globally so inline HTML events (like onchange) can access it
        window.state = state;

        let unsubMembers = null;
        let unsubTrans = null;
        let isTransitioningAuth = false; // Previne piscar erro de banco de dados ao deslogar

        function setupListeners() {
            // Limpa os ouvintes antigos se existirem
            if (unsubMembers) unsubMembers();
            if (unsubTrans) unsubTrans();

            const membersRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'members');
            const transRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions');

            unsubMembers = onSnapshot(membersRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                state.dbError = null;
                render();
            }, (error) => {
                if(isTransitioningAuth) return;
                if(error.code === 'permission-denied') state.dbError = 'permission';
                render();
            });

            unsubTrans = onSnapshot(transRef, (snapshot) => {
                if(isTransitioningAuth) return;
                state.transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                state.dbError = null;
                render();
            }, (error) => {
                if(isTransitioningAuth) return;
                if(error.code === 'permission-denied') state.dbError = 'permission';
                render();
            });
        }

        onAuthStateChanged(auth, (user) => {
            isTransitioningAuth = false;
            if (user) {
                state.user = user;
                // Se não for anônimo, logou com email (é o Administrador)
                state.isAdmin = !user.isAnonymous; 
                setupListeners();
            } else {
                state.user = null;
                state.isAdmin = false;
                // Tenta login anônimo automático (Público)
                signInAnonymously(auth).catch((err) => {
                    console.warn("Autenticação anônima desabilitada.");
                    state.dbError = 'auth-anon-disabled';
                    render();
                });
            }
            render();
        });

        window.handleLogin = async (e) => {
            e.preventDefault();
            state.loginError = '';
            render();
            try {
                await signInWithEmailAndPassword(auth, state.loginEmail, state.loginPassword);
                state.showLoginModal = false;
                state.loginEmail = '';
                state.loginPassword = '';
            } catch (error) {
                state.loginError = 'E-mail ou senha incorretos.';
                render();
            }
        };

        window.handleResetPassword = async (e) => {
            e.preventDefault();
            if(!state.loginEmail) {
                state.loginError = 'Digite seu e-mail para recuperar.';
                render();
                return;
            }
            try {
                await sendPasswordResetEmail(auth, state.loginEmail);
                state.loginError = 'E-mail de recuperação enviado! Verifique sua caixa de entrada.';
                render();
            } catch(error) {
                state.loginError = 'Erro ao enviar. O e-mail está correto?';
                render();
            }
        };

        window.handleLogout = async () => {
            isTransitioningAuth = true;
            if(unsubMembers) unsubMembers();
            if(unsubTrans) unsubTrans();
            await signOut(auth);
        };

        window.handleAddMember = async (e) => {
            e.preventDefault();
            const name = document.getElementById('newMemberName').value;
            const mat = document.getElementById('newMemberMatricula').value;
            if (!name || !mat || !state.user) return;
            
            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'members'), {
                    name: name,
                    matricula: mat,
                    payments: {},
                    createdAt: Date.now()
                });
            } catch (error) { console.error(error); }
        };

        window.togglePayment = async (memberId, month) => {
            if (!state.user || !state.isAdmin) return;
            const member = state.members.find(m => m.id === memberId);
            if (!member) return;
            
            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', memberId), {
                    [`payments.${month}`]: !(member.payments || {})[month]
                });
            } catch (error) { console.error(error); }
        };

        window.handleDeleteMember = async (id) => {
            if (!state.user || !state.isAdmin) return;
            try { await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', id)); } catch(e) {}
        };

        window.handleAddTransaction = async (e) => {
            e.preventDefault();
            const type = document.querySelector('input[name="transType"]:checked').value;
            const desc = document.getElementById('newTransDesc').value;
            const amount = document.getElementById('newTransAmount').value;
            const product = document.getElementById('newTransProduct') ? document.getElementById('newTransProduct').value : '';
            
            if (!desc || !amount || !state.user) return;
            
            try {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'transactions'), {
                    type,
                    description: desc,
                    amount: parseFloat(amount),
                    month: state.selectedMonth,
                    product: type === 'expense' ? product : '',
                    createdAt: Date.now()
                });
            } catch(e) {}
        };

        window.handleDeleteTransaction = async (id) => {
            if (!state.user || !state.isAdmin) return;
            try { await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'transactions', id)); } catch(e) {}
        };

        // Window Helper Functions to bridge Vanilla HTML and module state
        window.setTab = (tab) => { 
            state.activeTab = tab; 
            render(); 
            // Faz a rolagem suave para baixo em celulares ao trocar de aba
            if (window.innerWidth < 768) {
                document.getElementById('main-content')?.scrollIntoView({ behavior: 'smooth' });
            }
        };
        window.setMonth = (month) => { state.selectedMonth = month; render(); };
        window.toggleModal = (show) => { state.showLoginModal = show; state.loginError = ''; render(); };
        window.toggleReset = (reset) => { state.isResetting = reset; state.loginError = ''; render(); };
        
        const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

        function render() {
            const appDiv = document.getElementById('app');
            
            // Calculos de saldo
            const monthTrans = state.transactions.filter(t => t.month === state.selectedMonth);
            const totalIncome = monthTrans.filter(t => t.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
            const totalExpense = monthTrans.filter(t => t.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
            const balance = totalIncome - totalExpense;
            
            const allIncome = state.transactions.filter(t => t.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
            const allExpense = state.transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
            const totalBalance = allIncome - allExpense;

            let content = `
            <!-- Sidebar -->
            <nav class="w-full md:w-64 bg-brand-panel p-6 shadow-2xl flex flex-col justify-between shrink-0 border-r border-brand-muted/10 z-20">
                <div>
                    <div class="flex items-center gap-3 mb-10 group cursor-default">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-accent to-blue-800 flex items-center justify-center shadow-lg border border-brand-accent/30">
                            <span class="font-bold text-xl text-white tracking-wider">PIT</span>
                        </div>
                        <div>
                            <h1 class="font-bold text-xl leading-tight text-white">Grêmio PIT</h1>
                            <p class="text-xs text-brand-muted tracking-widest uppercase">Financeiro</p>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <button onclick="setTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-300 ${state.activeTab === 'dashboard' ? 'bg-brand-accent/20 text-brand-accent shadow-inner border-l-4 border-brand-accent' : 'hover:bg-brand-dark text-brand-muted'}">
                            <i data-lucide="trending-up" class="${state.activeTab === 'dashboard' ? 'text-brand-accent' : 'text-brand-muted'} w-5 h-5"></i>
                            <span class="font-medium">Visão Geral</span>
                        </button>
                        <button onclick="setTab('members')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-300 ${state.activeTab === 'members' ? 'bg-brand-accent/20 text-brand-accent shadow-inner border-l-4 border-brand-accent' : 'hover:bg-brand-dark text-brand-muted'}">
                            <i data-lucide="users" class="${state.activeTab === 'members' ? 'text-brand-accent' : 'text-brand-muted'} w-5 h-5"></i>
                            <span class="font-medium">Contribuintes</span>
                        </button>
                        <button onclick="setTab('transactions')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-300 ${state.activeTab === 'transactions' ? 'bg-brand-accent/20 text-brand-accent shadow-inner border-l-4 border-brand-accent' : 'hover:bg-brand-dark text-brand-muted'}">
                            <i data-lucide="wallet" class="${state.activeTab === 'transactions' ? 'text-brand-accent' : 'text-brand-muted'} w-5 h-5"></i>
                            <span class="font-medium">Fluxo de Caixa</span>
                        </button>
                    </div>

                    <div class="mt-8 pt-6 border-t border-brand-dark">
                        ${!state.isAdmin ? `
                            <button onclick="toggleModal(true)" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-brand-muted hover:bg-brand-dark transition-colors">
                                <i data-lucide="lock" class="w-5 h-5"></i>
                                <span class="font-medium">Acesso Admin</span>
                            </button>
                        ` : `
                            <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-brand-danger/10 text-brand-danger hover:bg-brand-danger/20 transition-all border border-brand-danger/30">
                                <i data-lucide="unlock" class="w-5 h-5"></i>
                                <span class="font-medium">Sair (Admin)</span>
                            </button>
                        `}
                    </div>
                </div>

                <div class="mt-10 p-4 bg-brand-dark rounded-xl border border-brand-muted/20">
                    <p class="text-xs text-brand-muted mb-1">Saldo Acumulado</p>
                    <p class="text-lg font-bold ${totalBalance >= 0 ? 'text-brand-success' : 'text-brand-danger'}">
                        ${formatCurrency(totalBalance)}
                    </p>
                </div>
            </nav>
            `;

            content += `
            <main id="main-content" class="flex-1 p-4 md:p-8 relative w-full h-full md:overflow-y-auto">
                <!-- Erros de Configuração -->
                ${state.dbError === 'permission' ? `
                    <div class="mb-6 bg-brand-warning/10 border border-brand-warning/40 text-brand-warning p-4 rounded-xl flex items-start gap-3">
                        <i data-lucide="alert-triangle" class="w-6 h-6 flex-shrink-0 mt-1"></i>
                        <div>
                            <h4 class="font-bold text-lg">Acesso Bloqueado no Firebase!</h4>
                            <p class="text-sm opacity-90 mt-1">As regras de segurança do seu banco de dados estão bloqueando a leitura. Vá no painel do Firebase em "Firestore Database > Regras" e aplique <code>allow read, write: if request.auth != null;</code></p>
                        </div>
                    </div>
                ` : ''}

                <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h2 class="text-3xl font-extrabold tracking-tight text-white">
                            ${state.activeTab === 'dashboard' ? 'Visão Geral' : state.activeTab === 'members' ? 'Controle de Contribuintes' : 'Fluxo de Caixa'}
                        </h2>
                        <p class="text-brand-muted text-sm mt-1">Painel financeiro dinâmico e inteligente</p>
                    </div>
                    <div class="flex items-center bg-brand-panel p-1 rounded-xl shadow-sm border border-brand-muted/20">
                        <i data-lucide="calendar-days" class="text-brand-muted ml-3 mr-2 w-5 h-5"></i>
                        <select onchange="setMonth(this.value)" class="bg-transparent border-none outline-none text-brand-text font-semibold py-2 pr-4 pl-1 cursor-pointer appearance-none">
                            ${MONTHS.map(m => `<option value="${m}" class="bg-brand-panel" ${state.selectedMonth === m ? 'selected' : ''}>${m}</option>`).join('')}
                        </select>
                    </div>
                </header>
            `;

            if (state.activeTab === 'dashboard') {
                content += `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-brand-panel rounded-2xl p-6 border-l-4 border-brand-success shadow-md">
                            <p class="text-sm font-medium text-brand-muted uppercase tracking-wider">Receitas (${state.selectedMonth})</p>
                            <h3 class="text-2xl font-bold text-brand-success mt-2">${formatCurrency(totalIncome)}</h3>
                        </div>
                        <div class="bg-brand-panel rounded-2xl p-6 border-l-4 border-brand-danger shadow-md">
                            <p class="text-sm font-medium text-brand-muted uppercase tracking-wider">Despesas (${state.selectedMonth})</p>
                            <h3 class="text-2xl font-bold text-brand-danger mt-2">${formatCurrency(totalExpense)}</h3>
                        </div>
                        <div class="bg-brand-panel rounded-2xl p-6 border-l-4 ${balance >= 0 ? 'border-brand-accent' : 'border-brand-warning'} shadow-md">
                            <p class="text-sm font-medium text-brand-muted uppercase tracking-wider">Saldo do Mês</p>
                            <h3 class="text-2xl font-bold mt-2 ${balance >= 0 ? 'text-brand-accent' : 'text-brand-warning'}">${formatCurrency(balance)}</h3>
                        </div>
                    </div>
                    <div class="bg-brand-panel rounded-2xl p-6 border border-brand-muted/10 shadow-md">
                        <h3 class="text-lg font-bold mb-4">Movimentações em ${state.selectedMonth}</h3>
                        ${monthTrans.length === 0 ? `<p class="text-brand-muted italic text-center py-4">Nenhuma movimentação.</p>` : 
                        `<div class="space-y-3">
                            ${monthTrans.slice(-5).reverse().map(t => `
                                <div class="flex justify-between items-center p-4 bg-brand-dark rounded-xl border border-brand-muted/10">
                                    <div class="flex items-center gap-4">
                                        <div class="p-2 rounded-full ${t.type === 'income' ? 'bg-brand-success/10 text-brand-success' : 'bg-brand-danger/10 text-brand-danger'}">
                                            <i data-lucide="${t.type === 'income' ? 'plus' : 'minus'}" class="w-4 h-4"></i>
                                        </div>
                                        <div>
                                            <p class="font-semibold">${t.description}</p>
                                            ${t.product ? `<p class="text-xs text-brand-muted flex items-center gap-1 mt-1"><i data-lucide="package" class="w-3 h-3"></i> ${t.product}</p>` : ''}
                                        </div>
                                    </div>
                                    <span class="font-bold ${t.type === 'income' ? 'text-brand-success' : 'text-brand-danger'}">
                                        ${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}
                                    </span>
                                </div>
                            `).join('')}
                        </div>`}
                    </div>
                `;
            } else if (state.activeTab === 'members') {
                content += `
                    ${state.isAdmin ? `
                    <div class="bg-brand-panel rounded-2xl p-6 shadow-md border border-brand-muted/10 mb-6">
                        <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="user-plus" class="text-brand-accent w-5 h-5"></i> Novo Contribuinte</h3>
                        <form onsubmit="handleAddMember(event)" class="flex flex-col md:flex-row gap-4">
                            <input type="text" id="newMemberName" placeholder="Nome Completo" class="flex-1 bg-brand-dark border-none outline-none focus:ring-2 focus:ring-brand-accent rounded-xl px-4 py-3 text-white placeholder-brand-muted" required/>
                            <input type="text" id="newMemberMatricula" placeholder="Matrícula" class="flex-1 bg-brand-dark border-none outline-none focus:ring-2 focus:ring-brand-accent rounded-xl px-4 py-3 text-white placeholder-brand-muted" required/>
                            <button type="submit" class="bg-brand-accent hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2">
                                <i data-lucide="plus" class="w-5 h-5"></i> Adicionar
                            </button>
                        </form>
                    </div>` : ''}
                    
                    <div class="bg-brand-panel rounded-2xl shadow-md border border-brand-muted/10 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-brand-dark border-b border-brand-muted/10">
                                        <th class="p-4 font-semibold text-brand-muted">Nome / Matrícula</th>
                                        ${MONTHS.map(m => `<th class="p-4 font-semibold text-center ${m === state.selectedMonth ? 'text-brand-text bg-brand-muted/10' : 'text-brand-muted'}">${m}</th>`).join('')}
                                        ${state.isAdmin ? `<th class="p-4 font-semibold text-center text-brand-muted">Ação</th>` : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-brand-muted/10">
                                    ${state.members.length === 0 ? `<tr><td colspan="14" class="p-8 text-center text-brand-muted italic">Nenhum contribuinte cadastrado.</td></tr>` : 
                                    state.members.map(member => `
                                        <tr class="hover:bg-brand-dark/50 transition-colors">
                                            <td class="p-4">
                                                <p class="font-medium whitespace-nowrap">${member.name}</p>
                                                <p class="text-xs text-brand-muted font-mono mt-1">${member.matricula}</p>
                                            </td>
                                            ${MONTHS.map(m => {
                                                const isPaid = (member.payments || {})[m];
                                                return `
                                                <td class="p-4 text-center ${m === state.selectedMonth ? 'bg-brand-dark/30' : ''}">
                                                    <button 
                                                        onclick="togglePayment('${member.id}', '${m}')"
                                                        ${!state.isAdmin ? 'disabled' : ''}
                                                        class="w-8 h-8 rounded-full flex items-center justify-center mx-auto transition-all ${isPaid ? 'bg-brand-success/20 text-brand-success border border-brand-success/30' : 'bg-brand-dark text-brand-muted border border-brand-muted/20'} ${state.isAdmin ? 'hover:scale-110 cursor-pointer' : 'opacity-80 cursor-default'}"
                                                    >
                                                        <i data-lucide="${isPaid ? 'check' : 'x'}" class="w-4 h-4"></i>
                                                    </button>
                                                </td>`
                                            }).join('')}
                                            ${state.isAdmin ? `
                                            <td class="p-4 text-center">
                                                <button onclick="handleDeleteMember('${member.id}')" class="text-brand-danger hover:text-red-400 p-2 rounded-lg hover:bg-brand-danger/10 transition-colors">
                                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                                </button>
                                            </td>` : ''}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (state.activeTab === 'transactions') {
                content += `
                    ${state.isAdmin ? `
                    <div class="bg-brand-panel rounded-2xl p-6 shadow-md border border-brand-muted/10 mb-6">
                        <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="wallet" class="text-brand-accent w-5 h-5"></i> Novo Lançamento (${state.selectedMonth})</h3>
                        <form onsubmit="handleAddTransaction(event)" class="space-y-4">
                            <div class="flex gap-4">
                                <label class="flex-1 cursor-pointer flex items-center justify-center gap-2 p-3 rounded-xl border-2 transition-all has-[:checked]:border-brand-success has-[:checked]:bg-brand-success/10 has-[:checked]:text-brand-success border-brand-dark text-brand-muted hover:border-brand-muted/30 bg-brand-dark">
                                    <input type="radio" name="transType" value="income" checked class="hidden" onchange="render()"/>
                                    <i data-lucide="plus" class="w-5 h-5"></i> Receita
                                </label>
                                <label class="flex-1 cursor-pointer flex items-center justify-center gap-2 p-3 rounded-xl border-2 transition-all has-[:checked]:border-brand-danger has-[:checked]:bg-brand-danger/10 has-[:checked]:text-brand-danger border-brand-dark text-brand-muted hover:border-brand-muted/30 bg-brand-dark">
                                    <input type="radio" name="transType" value="expense" class="hidden" onchange="render()"/>
                                    <i data-lucide="minus" class="w-5 h-5"></i> Despesa
                                </label>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" id="newTransDesc" placeholder="Descrição" class="bg-brand-dark border-none outline-none focus:ring-2 focus:ring-brand-accent rounded-xl px-4 py-3 text-white placeholder-brand-muted" required/>
                                <input type="number" id="newTransAmount" step="0.01" placeholder="Valor (R$)" class="bg-brand-dark border-none outline-none focus:ring-2 focus:ring-brand-accent rounded-xl px-4 py-3 text-white placeholder-brand-muted" required/>
                            </div>
                            
                            ${document.querySelector('input[name="transType"]:checked')?.value === 'expense' || !document.querySelector('input[name="transType"]:checked') ? 
                            `<input type="text" id="newTransProduct" placeholder="Produtos Adquiridos (opcional)" class="w-full bg-brand-dark border-none outline-none focus:ring-2 focus:ring-brand-danger rounded-xl px-4 py-3 text-white placeholder-brand-muted"/>` 
                            : ''}

                            <div class="flex justify-end">
                                <button type="submit" class="bg-brand-accent hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-md flex items-center gap-2">
                                    Registrar
                                </button>
                            </div>
                        </form>
                    </div>` : ''}

                    <div class="bg-brand-panel rounded-2xl shadow-md border border-brand-muted/10 overflow-hidden">
                        <div class="bg-brand-dark p-4 border-b border-brand-muted/10"><h4 class="font-semibold text-brand-muted">Registros do Mês</h4></div>
                        <div class="divide-y divide-brand-muted/10">
                            ${monthTrans.length === 0 ? `<div class="p-8 text-center text-brand-muted italic">Nenhuma movimentação neste mês.</div>` : 
                            monthTrans.map(t => `
                                <div class="p-4 flex flex-col md:flex-row justify-between md:items-center hover:bg-brand-dark/50 transition-colors gap-4">
                                    <div class="flex items-start gap-4">
                                        <div class="p-2 rounded-full flex-shrink-0 ${t.type === 'income' ? 'bg-brand-success/10 text-brand-success' : 'bg-brand-danger/10 text-brand-danger'}">
                                            <i data-lucide="${t.type === 'income' ? 'plus' : 'minus'}" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h5 class="font-bold">${t.description}</h5>
                                            ${t.product ? `<div class="flex items-center gap-1 text-xs text-brand-muted mt-1 bg-brand-dark inline-block px-2 py-1 rounded-md"><i data-lucide="package" class="w-3 h-3"></i> ${t.product}</div>` : ''}
                                        </div>
                                    </div>
                                    <div class="flex items-center justify-between md:justify-end gap-6 w-full md:w-auto pl-14 md:pl-0">
                                        <span class="font-bold text-lg ${t.type === 'income' ? 'text-brand-success' : 'text-brand-danger'}">
                                            ${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}
                                        </span>
                                        ${state.isAdmin ? `
                                        <button onclick="handleDeleteTransaction('${t.id}')" class="text-brand-danger hover:text-red-400 p-2 rounded-lg hover:bg-brand-danger/10 transition-colors">
                                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                                        </button>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            content += `</main>`;

            if (state.showLoginModal) {
                content += `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-brand-panel rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl border border-brand-muted/20">
                        <div class="flex items-center justify-center w-16 h-16 bg-brand-dark text-brand-accent rounded-full mx-auto mb-4 border border-brand-accent/30 shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                            <i data-lucide="${state.isResetting ? 'mail' : 'lock'}" class="w-8 h-8"></i>
                        </div>
                        
                        <h3 class="text-2xl font-bold text-center mb-2">${state.isResetting ? 'Recuperar Senha' : 'Acesso Admin'}</h3>
                        <p class="text-center text-brand-muted mb-6 text-sm">
                            ${state.isResetting ? 'Enviaremos um link para redefinir sua senha.' : 'Faça login com Email e Senha para habilitar a edição.'}
                        </p>
                        
                        <form onsubmit="${state.isResetting ? 'handleResetPassword(event)' : 'handleLogin(event)'}" class="space-y-4">
                            <input type="email" placeholder="E-mail do Administrador" value="${state.loginEmail}" onchange="state.loginEmail=this.value" class="w-full bg-brand-dark border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white placeholder-brand-muted" required autofocus/>
                            
                            ${!state.isResetting ? `
                            <input type="password" placeholder="Senha" value="${state.loginPassword}" onchange="state.loginPassword=this.value" class="w-full bg-brand-dark border border-brand-muted/30 focus:border-brand-accent outline-none rounded-xl px-4 py-3 text-white placeholder-brand-muted" required/>
                            ` : ''}
                            
                            ${state.loginError ? `<p class="text-brand-warning text-sm mt-2 text-center bg-brand-warning/10 p-2 rounded-lg">${state.loginError}</p>` : ''}
                            
                            <div class="flex gap-3 mt-8 pt-4">
                                <button type="button" onclick="toggleModal(false)" class="flex-1 px-4 py-3 rounded-xl font-bold text-brand-muted bg-brand-dark hover:bg-brand-muted/10 transition-colors">Cancelar</button>
                                <button type="submit" class="flex-1 px-4 py-3 rounded-xl font-bold text-white bg-brand-accent hover:bg-blue-600 transition-colors shadow-lg shadow-blue-500/30">
                                    ${state.isResetting ? 'Enviar Link' : 'Entrar'}
                                </button>
                            </div>

                            <div class="text-center mt-4">
                                <button type="button" onclick="toggleReset(${!state.isResetting})" class="text-sm text-brand-accent hover:text-blue-400 underline transition-colors">
                                    ${state.isResetting ? 'Voltar para o Login' : 'Esqueceu a senha?'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>`;
            }

            appDiv.innerHTML = content;
            lucide.createIcons(); // Initialize icons
        }
        
        // Initial render
        render();
    </script>
</body>
</html>
